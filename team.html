<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOFER'S TAVERN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

         <div class="nav-logo">
            TOFER'S TAVERN
	</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#standings">Standings</a>
            <a href="index.html#teams">Teams</a>
            <a href="index.html#matchups">Matchups</a>
        </div>

    </nav>


    <main class="team-page">

        <section class="team-profile">

            <div id="team-page-avatar"></div>

            <div>

                <h1 id="team-page-name">
                    Loading Team...
                </h1>

                <p id="team-page-manager">
                    Loading manager...
                </p>

            </div>

        </section>


        <section class="team-stats">

            <div class="card">

                <h3 id="team-wins">0</h3>

                <p>Wins</p>

            </div>


            <div class="card">

                <h3 id="team-losses">0</h3>

                <p>Losses</p>

            </div>


            <div class="card">

                <h3 id="team-points">0.00</h3>

                <p>Points</p>

            </div>

        </section>

        <section class="team-week-section">

    	<h2 id="team-week-title">
            This Week
        </h2>

        <div id="team-week-matchup">
            Loading matchup...
        </div>

</section>


        <section class="team-roster-section">

            <h2>Roster</h2>

            <div id="team-page-roster">

                Loading roster...

            </div>

        </section>

    </main>

    <footer class="site-footer">

    <p>
        TOFER'S TAVERN • Fantasy Football League
    </p>

    <p class="footer-small">
        Powered by Sleeper data • Built by Ray
    </p>

</footer>

    <script src="team.js"></script>

</body>

</html>
